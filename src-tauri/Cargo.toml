[package]
name = "cats-configurator"
version = "2.0.0"
description = "Desktop configuration and flight-log analysis utility for CATS flight computers"
authors = ["Control and Telemetry Systems GmbH"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "cats_configurator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Only explicitly requested bench-test installers enable unaccepted platforms.
firmware-hardware-test = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = "0.4"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
nusb = { version = "0.2", features = ["tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json"] }
semver = "1"
sha2 = "0.11"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time", "fs"] }
tokio-serial = "5"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
tokio = { version = "1", features = ["process"] }

[dev-dependencies]
plist = "1"
