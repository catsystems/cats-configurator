[package]
name = "cats-configurator"
version = "2.0.0"
description = "Desktop configuration and flight-log analysis utility for CATS flight computers"
authors = ["Control and Telemetry Systems GmbH"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "cats_configurator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = "0.4"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-serial = "5"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
