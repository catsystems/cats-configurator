name: CI and release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows x64
            artifact: cats-configurator-windows-x64
            build_command: npm run build
            artifact_path: src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            name: Linux x64
            artifact: cats-configurator-linux-x64
            build_command: npm run build
            artifact_path: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
          - os: macos-latest
            name: macOS Apple Silicon
            artifact: cats-configurator-macos-arm64
            build_command: npm run build -- --target aarch64-apple-darwin
            artifact_path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - os: macos-latest
            name: macOS Intel
            artifact: cats-configurator-macos-x64
            build_command: npm run build -- --target x86_64-apple-darwin
            artifact_path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: ${{ startsWith(matrix.os, 'macos-') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libudev-dev patchelf xdg-utils

      - name: Install locked renderer dependencies
        run: npm ci

      - name: Check renderer formatting
        run: npm run format:check

      - name: Lint renderer
        run: npm run lint

      - name: Test renderer and host bridge
        run: npm test

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Reject critical development dependency findings
        run: npm audit --audit-level=critical

      - name: Verify application and release contract
        run: npm run verify:release-contract

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run verify:release-tag -- "$RELEASE_TAG"

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust backend
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Test Rust backend
        run: npm run test:rust

      - name: Build native package
        run: ${{ matrix.build_command }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.os, 'macos-') && '-' || '' }}

      - name: Verify CATS Flights production origin
        run: npm run verify:production-target

      - name: Upload native package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          pattern: cats-configurator-*
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: CATS Configurator ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            [Release policy](https://github.com/catsystems/cats-configurator/blob/main/RELEASE-POLICY.md)
            Tauri packages do not include automatic Configurator self-updates. Windows packages are unsigned; macOS packages are ad-hoc signed and not notarized.
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-artifacts/*
