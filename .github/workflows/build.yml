name: CI and release

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run unit and component tests
        run: npm test

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Reject critical development dependency findings
        run: npm audit --audit-level=critical

      - name: Run Electron smoke test
        run: xvfb-run --auto-servernum npm run test:e2e

      - name: Verify CATS Flights production origin
        run: npm run verify:production-target

      - name: Verify release artifact contract
        run: npm run verify:release-contract

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run verify:release-tag -- "$RELEASE_TAG"

  package:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: cats-configurator-windows
            platform: win32
            arch: x64
            command: npm run build -- --win nsis --x64 --publish never
            files: builds/*.exe
          - os: macos-latest
            artifact: cats-configurator-macos-x64
            platform: darwin
            arch: x64
            command: npm run build -- --mac dmg --x64 --publish never
            files: builds/*.dmg
          - os: macos-latest
            artifact: cats-configurator-macos-arm64
            platform: darwin
            arch: arm64
            command: npm run build -- --mac dmg --arm64 --publish never
            files: builds/*.dmg
          - os: ubuntu-latest
            artifact: cats-configurator-linux
            platform: linux
            arch: x64
            command: npm run build -- --linux AppImage --x64 --publish never
            files: builds/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Package application
        run: ${{ matrix.command }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify update asset name
        run: npm run verify:packaged-artifact -- ${{ matrix.platform }} ${{ matrix.arch }}

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          pattern: cats-configurator-*
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: CATS Configurator ${{ github.ref_name }}
          body: |
            [Code signing policy](https://github.com/catsystems/cats-configurator/blob/main/CODE_SIGNING_POLICY.md)
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-artifacts/*
